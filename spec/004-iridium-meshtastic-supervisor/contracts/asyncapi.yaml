asyncapi: 2.6.0
info:
  title: HAL driver event streams
  version: 1.0.0
  description: |
    Server-Sent Events streams from the IridiumDriver and MeshtasticDriver
    (per spec/004 REQ-313 + REQ-315).
servers:
  hal:
    url: http://localhost:6005
    protocol: http
    description: HAL SSE endpoints (text/event-stream Content-Type)
channels:
  /meshtastic/events:
    description: SSE stream of Meshtastic radio events
    subscribe:
      operationId: subscribeMeshtasticEvents
      message:
        contentType: application/json
        payload:
          type: object
          required: [type, timestamp]
          properties:
            type:
              type: string
              enum:
                - node_seen
                - message_received
                - message_sent
                - position_update
                - telemetry
                - admin_response
                - error
            timestamp: {type: string, format: date-time}
            node_id: {type: string}
            payload: {type: object, additionalProperties: true}
  /iridium/events:
    description: SSE stream of Iridium modem events
    subscribe:
      operationId: subscribeIridiumEvents
      message:
        contentType: application/json
        payload:
          type: object
          required: [type, timestamp]
          properties:
            type:
              type: string
              enum:
                - signal_change
                - message_received
                - message_sent
                - mailbox_check
                - at_command_response
                - error
            timestamp: {type: string, format: date-time}
            payload: {type: object, additionalProperties: true}
